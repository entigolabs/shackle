name: Build

# Tests, binaries and the image, for the Pull and Release workflows. The
# repository is public, so the workflows are its own and use only the
# workflow token: no shared private library, no stored credentials.

on:
  workflow_call:
    inputs:
      version:
        description: Version the binaries report and the image is tagged with
        required: true
        type: string
      push:
        description: Push the image to the registry; false builds it without publishing
        required: true
        type: boolean
    outputs:
      digest:
        description: Digest of the multi-arch image index; empty when the image was not pushed
        value: ${{ jobs.build.outputs.digest }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt formatted: $unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test -race ./...
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  build:
    name: Binaries and image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Both architectures are cross-compiled here, so neither the binaries
      # nor the image need an arm64 runner or emulation.
      - name: Build binaries
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/build.sh "$VERSION"
          dist/shackle-linux-amd64 version

      # CycloneDX, for the binary as it is built for linux/amd64; the arm64
      # binary has the same modules.
      - name: SBOM
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 app \
            -json -licenses -output dist/shackle.cdx.json -main .

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image labels
        id: labels
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          # Without a push there is nothing to attach attestations to.
          sbom: ${{ inputs.push }}
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          tags: ${{ env.IMAGE }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.title=shackle
            org.opencontainers.image.description=Cloud access for CI/CD: kubeconfig and cluster tokens, registry credentials and object storage copy, without the cloud CLIs
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.created=${{ steps.labels.outputs.created }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
          PUSH: ${{ inputs.push }}
        run: |
          {
            echo "### shackle $VERSION"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            if [ "$PUSH" = "true" ]; then
              echo
              echo "Image: \`${IMAGE}:${VERSION}@${DIGEST}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
